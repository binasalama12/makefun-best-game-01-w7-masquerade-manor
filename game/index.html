<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MASQUERADE MANOR — one guest is the Thorn: 7 rounds, 8 guests, 6 clue types, 8 tools, final case The Thorn Unmasked</title>
<style>
  html, body { margin: 0; padding: 0; background: #07060e; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #stage { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 1280px; height: 720px; background: #0d0a14; cursor: pointer; }
  #hud {
    position: absolute; left: 0; right: 0; top: 0; height: 46px;
    display: flex; align-items: center; gap: 20px; padding: 0 18px;
    color: #ffe9b8; font-size: 16.5px; letter-spacing: .03em;
    background: linear-gradient(180deg, rgba(5,4,14,.9), rgba(5,4,14,.55) 70%, rgba(5,4,14,0));
    pointer-events: none; text-shadow: 0 1px 3px #000;
  }
  #hud .lab { color: #b9a8e8; font-size: 11.5px; text-transform: uppercase; letter-spacing: .16em; margin-right: 5px; }
  #hud .val { font-weight: bold; }
  #boardwrap { flex: 0 0 150px; height: 10px; border: 1px solid #6b5aa8; border-radius: 5px; background: rgba(20,14,44,.8); overflow: hidden; }
  #boardbar { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #7a4fd0, #ffd76a); transition: width .2s; }
  #msg {
    position: absolute; left: 0; right: 0; bottom: 6px; text-align: center;
    color: #ffe9b8; font-size: 15px; pointer-events: none; text-shadow: 0 1px 4px #000;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span><span class="lab">Case</span><span class="val" id="h-case">–</span></span>
    <span><span class="lab">Round</span><span class="val" id="h-round">–</span></span>
    <span><span class="lab">Clock</span><span class="val" id="h-clock">–</span></span>
    <span><span class="lab">Clues</span><span class="val" id="h-clues">0 / 6 types</span></span>
    <span><span class="lab">Chain</span><span class="val" id="h-chain">—</span></span>
    <span><span class="lab">Score</span><span class="val" id="h-score">0</span></span>
    <span><span class="lab">Board</span><span class="val" id="h-board">0%</span></span><span id="boardwrap"><span id="boardbar"></span></span>
  </div>
  <div id="msg"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
